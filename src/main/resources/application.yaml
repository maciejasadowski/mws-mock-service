server:
  port: 8011
  servlet:
    context-path: /

spring:
  application:
    name: mws-mock-service
  jaxp:
    validation:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# CoCo OUT-database mock (H2 in-memory, exposed via TCP for the batch adapter)
# Batch adapter adapter.ini settings:
#   messagedb.url.out.ModusOne.<fachmodul>      = jdbc:h2:tcp://localhost:9092/mem:cocodb;SCHEMA=COCO_OUT
#   messagedb.username.out.ModusOne.<fachmodul> = COCO_OUT
#   messagedb.password.out.ModusOne.<fachmodul> = (empty)
batch:
  db:
    coco:
      url: jdbc:h2:mem:cocodb;DB_CLOSE_DELAY=-1;MODE=Oracle
      username: COCO_OUT
      password: ""
      tcp-port: 9092

logging:
  level:
    root: INFO
    com.capgemini.futura.mws: DEBUG
    org.springframework.ws: WARN
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


