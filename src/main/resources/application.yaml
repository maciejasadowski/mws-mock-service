server:
  port: 8011
  servlet:
    context-path: /

spring:
  application:
    name: mws-mock-service
  jaxp:
    validation:
      enabled: false

logging:
  level:
    root: INFO
    com.example.mws: DEBUG
    org.springframework.ws: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
